<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samspel Hub</title>
<style>
  :root { color-scheme: dark; --bg:#111; --card:#1d1d1f; --fg:#f2f2f2; --dim:#8e8e93; --accent:#d4a574; }
  body { margin:0; font:16px system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; } h2 { font-size:.8rem; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin:24px 0 8px; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:10px; }
  .row { display:flex; align-items:center; gap:10px; justify-content:space-between; }
  .dim { color:var(--dim); font-size:.85rem; }
  button { background:#2c2c2e; color:var(--fg); border:0; border-radius:10px; padding:8px 14px; font:inherit; }
  button.primary { background:var(--accent); color:#111; }
  input[type=text] { width:100%; box-sizing:border-box; background:#2c2c2e; color:var(--fg); border:0; border-radius:10px; padding:10px; font:inherit; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .np { display:flex; gap:10px; align-items:center; margin-top:8px; }
  .np:empty { display:none; }
  .np img { width:48px; height:48px; border-radius:8px; object-fit:cover; }
  .np b, .np span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  select { background:#2c2c2e; color:var(--fg); border:0; border-radius:8px; padding:6px; font:inherit; }
  label { display:flex; gap:8px; align-items:center; padding:4px 0; }
</style>
</head>
<body>
<main>
  <h1>Samspel Hub</h1>
  <div id="msg" class="dim"></div>

  <h2>Grupper</h2>
  <div id="groups"></div>

  <h2>Ny grupp</h2>
  <div class="card">
    <input id="gname" type="text" placeholder="Gruppnamn (t.ex. Vardagsrum)">
    <div id="pick" style="margin:10px 0"></div>
    <button class="primary" id="create">Skapa grupp</button>
  </div>

  <h2>Enheter</h2>
  <div class="row" style="margin-bottom:8px"><span class="dim">Cast och Denon HEOS</span><button id="scan">Sök igen</button></div>
  <div id="devices"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const api = (path, opts = {}) => fetch('api/' + path, { headers:{'Content-Type':'application/json'}, ...opts })
  .then(async r => { if (!r.ok) throw new Error(await r.text() || r.statusText); return r.status === 204 ? null : r.json(); });
const post = (path, body) => api(path, { method:'POST', body: body && JSON.stringify(body) });
const say = t => $('#msg').textContent = t || '';
let devices = [], groups = [];

// Delays are calibrated per format, see hub.DelayKey.
const delayKey = (g, dev) => g.format && g.format !== 'mp3-192' ? `${dev}@${g.format}` : dev;

const npHtml = g => {
  const n = g && g.nowPlaying; if (!n || !(n.title || n.playing)) return '';
  const img = n.coverVer ? `<img src="api/groups/${g.id}/cover?v=${n.coverVer}" alt="">` : '';
  return `${img}<div style="min-width:0"><b>${esc(n.title || 'Spelar')}</b><span class="dim">${esc([n.artist, n.album].filter(Boolean).join(' · '))}${n.playing ? '' : ' · pausad'}</span></div>`;
};
const soloName = d => (groups.find(g => g.id === 'solo-' + d.id) || {}).name;

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function render() {
  const name = id => (devices.find(d => d.id === id) || {name:id}).name;
  $('#devices').innerHTML = devices.map(d => `
    <div class="card"><div class="row"><div><b>${esc(d.name)}</b><div class="dim">${d.kind} · ${esc(d.addr)}${soloName(d) ? ' · AirPlay: ”' + esc(soloName(d)) + '”' : ''}</div></div></div>
    <div class="np" data-np="solo-${d.id}">${npHtml(groups.find(g => g.id === 'solo-' + d.id))}</div>
    <label class="row"><span class="dim">Ljudformat</span><select data-dev-format="${d.id}">
      <option value=""${d.format ? '' : ' selected'}>Normal (MP3)</option>
      <option value="wav"${d.format === 'wav' ? ' selected' : ''}>Lågt lagg (WAV)</option></select></label>
    <label class="row"><span class="dim">Förråd vid start</span><span class="dim"><input type="number" min="1" max="30" step="1" style="width:4em"
      value="${d.cushionSec || 3}" data-dev-cushion="${d.id}"> s</span></label>
    <input type="range" min="0" max="100" value="30" data-vol="${d.id}"></div>`).join('') || '<div class="dim">Inga enheter hittade än.</div>';
  $('#pick').innerHTML = devices.map(d => `<label><input type="checkbox" value="${d.id}"> ${esc(d.name)}</label>`).join('');
  $('#groups').innerHTML = groups.filter(g => !g.solo).map(g => `
    <div class="card"><div class="row"><div><b>${esc(g.name)}</b>
      <div class="dim">${g.airplay ? 'AirPlay: välj ”' + esc(g.name) + '” på telefonen' : 'AirPlay ej tillgängligt'}${g.deviceIds.length ? '' : ' · Tom grupp'}</div></div>
      <div><button data-act="${g.active ? 'stop' : 'play'}" data-id="${g.id}" class="${g.active ? '' : 'primary'}">${g.active ? 'Stoppa' : 'Testton'}</button>
      <button data-act="del" data-id="${g.id}">✕</button></div></div>
      <div class="np" data-np="${g.id}">${npHtml(g)}</div>
      <label class="row"><span>Ljudformat</span><select data-format-group="${g.id}">
        <option value=""${g.format ? '' : ' selected'}>Normal (MP3)</option>
        <option value="wav"${g.format === 'wav' ? ' selected' : ''}>Lågt lagg (WAV)</option></select></label>
      ${g.deviceIds.map(i => `<label class="row"><span>${esc(name(i))}</span><span class="dim"><input type="number" min="0" max="40" step="0.5" style="width:4.5em"
        value="${((g.delaysMs || {})[delayKey(g, i)] || 0) / 1000}" data-delay-group="${g.id}" data-delay-dev="${i}"> s fördröjning</span>
        <span class="dim"><input type="number" min="0" max="100" step="5" style="width:4em"
        value="${(g.trimsPct || {})[i] ?? 100}" data-trim-group="${g.id}" data-trim-dev="${i}"> % nivå</span></label>`).join('')}
      </div>`).join('') || '<div class="dim">Inga grupper än.</div>';
}

async function refresh() { [devices, groups] = await Promise.all([api('devices'), api('groups')]); render(); }

$('#scan').onclick = async () => {
  say('Söker efter enheter…');
  try { const r = await post('discover'); devices = r.devices; say(r.error || ''); } catch (e) { say(e.message); }
  await refresh();
};
$('#create').onclick = async () => {
  const deviceIds = [...document.querySelectorAll('#pick input:checked')].map(i => i.value);
  const name = $('#gname').value.trim();
  if (!name) return say('Ange ett gruppnamn.');
  try { await post('groups', { name, deviceIds }); $('#gname').value = ''; say(''); await refresh(); } catch (e) { say(e.message); }
};
$('#groups').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    if (b.dataset.act === 'del') await api('groups/' + b.dataset.id, { method:'DELETE' });
    else { say(b.dataset.act === 'play' ? 'Startar…' : ''); await post(`groups/${b.dataset.id}/${b.dataset.act}${b.dataset.act === 'play' ? '?tone=1' : ''}`); say(''); }
  } catch (err) { say(err.message); }
  await refresh();
};
$('#groups').onchange = async e => {
  const el = e.target;
  if (el.dataset.formatGroup) {
    const g = groups.find(x => x.id === el.dataset.formatGroup);
    g.format = el.value;
    try { await post('groups', g); await refresh(); say(g.active ? 'Formatet gäller nästa gång gruppen startar. Fördröjningen sparas separat per format.' : 'Fördröjningen sparas separat per format.'); } catch (err) { say(err.message); }
    return;
  }
  if (el.dataset.trimGroup) {
    const g = groups.find(x => x.id === el.dataset.trimGroup);
    g.trimsPct = { ...(g.trimsPct || {}), [el.dataset.trimDev]: Math.max(0, Math.min(100, Math.round(+el.value))) };
    try { await post('groups', g); say(''); } catch (err) { say(err.message); }
    return;
  }
  if (!el.dataset.delayGroup) return;
  const g = groups.find(x => x.id === el.dataset.delayGroup);
  g.delaysMs = { ...(g.delaysMs || {}), [delayKey(g, el.dataset.delayDev)]: Math.round(+el.value * 1000) };
  try { await post('groups', g); say(g.active ? 'Fördröjningen gäller nästa gång du trycker Spela.' : ''); } catch (err) { say(err.message); }
};
$('#devices').onchange = async e => {
  if (e.target.dataset.devCushion) {
    try { await post(`devices/${e.target.dataset.devCushion}/cushion`, { seconds: Math.round(+e.target.value) }); say('Gäller nästa gång högtalaren startar.'); await refresh(); } catch (err) { say(err.message); }
    return;
  }
  if (e.target.dataset.devFormat) {
    try { await post(`devices/${e.target.dataset.devFormat}/format`, { format: e.target.value }); say('Formatet gäller nästa gång högtalaren startar.'); await refresh(); } catch (err) { say(err.message); }
    return;
  }
  if (e.target.dataset.vol) post(`devices/${e.target.dataset.vol}/volume`, { percent:+e.target.value }).catch(err => say(err.message));
};
setInterval(async () => {
  try {
    groups = await api('groups');
    for (const g of groups) document.querySelectorAll(`[data-np="${g.id}"]`).forEach(el => { const h = npHtml(g); if (el.dataset.html !== h) { el.innerHTML = h; el.dataset.html = h; } });
  } catch (e) { /* hub restarting, try again next tick */ }
}, 4000);
refresh();
</script>
</body>
</html>

name: Samspel Hub
version: "0.6.8"
slug: samspel
description: Multiroom-hubb för Google Cast och Denon HEOS
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Högtalarna hämtar ljudet direkt från hubben och upptäckts-protokollen (mDNS/SSDP) kräver värdnätverk.
host_network: true
# Länken "Öppna webbgränssnittet" på tilläggets informationssida. Formen [HOST]:[PORT:nnnn] är den som dokumentationen
# visar. Porten behöver finnas under ports för att kunna slås upp, även om värdnätverket gör att den inte mappas.
webui: "http://[HOST]:[PORT:8080]/"
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Webbgränssnitt och ljudströmmar

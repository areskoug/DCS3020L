name: Samspel Hub
version: "0.7.0"
slug: samspel
description: Multiroom-hubb för Google Cast och Denon HEOS
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Högtalarna hämtar ljudet direkt från hubben och upptäckts-protokollen (mDNS/SSDP) kräver värdnätverk.
host_network: true
# Länken "Besök webbsidan" på tilläggets informationssida. Fast lokal adress: [HOST] i webui blir den adress man har
# i webbläsaren, alltså Nabu Casa-adressen vid fjärråtkomst, och där finns inte port 8080.
url: "http://192.168.1.168:8080/"

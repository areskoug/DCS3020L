name: Samspel Hub
version: "0.6.6"
slug: samspel
description: Multiroom-hubb för Google Cast och Denon HEOS
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Högtalarna hämtar ljudet direkt från hubben och upptäckts-protokollen (mDNS/SSDP) kräver värdnätverk.
host_network: true
# Länken "Öppna webbgränssnittet" på tilläggets informationssida. Porten är fast eftersom vi kör på värdnätverket.
webui: "http://[HOST]:8080/"
